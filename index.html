<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>'HVL' - RPT MCK</title>
<link rel="icon" type="image/x-icon" href="./cover.jpg"><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #08080b;
    --bg-panel: #111116;
    --glass: rgba(255,255,255,0.055);
    --glass-strong: rgba(255,255,255,0.10);
    --border-faint: rgba(255,255,255,0.08);
    --border-hover: rgba(198,232,255,0.35);
    --ice: #cfeeff;
    --ice-dim: #7fb8d6;
    --text: #f1f1f4;
    --text-muted: #85858f;
    --text-faint: #4c4c55;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: var(--bg-deep);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }
  ::selection{ background: rgba(207,238,255,0.25); }

  .app{
    flex:1;
    display:grid;
    grid-template-columns: 400px 1fr;
    gap: 0;
    padding: 40px 40px 130px 40px;
    max-width: 1180px;
    margin: 0 auto;
    width:100%;
  }
  @media (max-width: 820px){
    .app{ grid-template-columns: 1fr; padding: 24px 16px 150px 16px; gap: 28px; }
  }

  /* ---------- SIDE PANEL ---------- */
  .side{
    position: sticky;
    top: 40px;
    align-self: start;
    display:flex;
    flex-direction:column;
    gap: 22px;
    padding-right: 34px;
  }
  @media (max-width: 820px){ .side{ position: static; padding-right:0; } }

  .disc-wrap{
    width: 100%;
    aspect-ratio: 1/1;
    display:flex; align-items:center; justify-content:center;
    position: relative;
    cursor: pointer;
  }
  .disc{
    width: 96%;
    aspect-ratio: 1/1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, #1a1a20 0%, #0c0c10 38%, #050506 39%, #050506 60%, #17171d 61%, #0a0a0d 100%);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
    position: relative;
    transition: transform 0.6s ease;
    animation: spin 14s linear infinite;
    animation-play-state: paused;
  }
  .disc::before{
    content:'';
    position:absolute; inset:0; border-radius:50%;
    background: repeating-radial-gradient(circle at 50% 50%, transparent 0 6px, rgba(255,255,255,0.015) 6px 7px);
  }
  .disc-flip-wrap{
    position:absolute; top:50%; left:50%;
    width: 90%; height:90%;
    transform: translate(-50%,-50%);
    perspective: 1200px;
    z-index: 1;
  }
  .disc-flip{
    position:relative; width:100%; height:100%;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(.4,.1,.2,1);
  }
  .disc-flip.flipped{ transform: rotateY(180deg); }
  .disc-face{
    position:absolute; inset:0;
    border-radius:50%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: linear-gradient(135deg, #1c1c22, #0a0a0d);
    background-size: cover;
    background-position: center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
  }
  .disc-face-back{ transform: rotateY(180deg); }
  .disc-spindle{
    position:absolute; top:50%; left:50%;
    width: 8%; height:8%;
    transform: translate(-50%,-50%);
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #2a2a30, #060607 70%);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 2px 6px rgba(0,0,0,0.6);
    z-index: 3;
  }
  .disc.playing{ animation-play-state: running; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .disc-sheen{
    position:absolute; inset:0; border-radius:50%;
    background: linear-gradient(120deg, rgba(207,238,255,0.16) 0%, transparent 30%, transparent 70%, rgba(207,238,255,0.08) 100%);
    mix-blend-mode: screen;
    pointer-events:none;
    width: 96%; height:96%;
    left:50%; top:50%; transform: translate(-50%,-50%);
    z-index: 2;
  }

  .brand{ display:flex; flex-direction:column; gap:4px; }
  .brand h1{
    font-family:'Space Grotesk', sans-serif;
    font-size: 40px; font-weight:700; letter-spacing:-0.01em;
    line-height:1.05;
  }

  .dropzone{
    border: 1px dashed var(--border-faint);
    border-radius: 16px;
    padding: 18px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    text-align:center;
    transition: border-color 0.25s ease, background 0.25s ease, backdrop-filter 0.25s ease;
    cursor:pointer;
    background: transparent;
  }
  .dropzone:hover, .dropzone.drag{
    border-color: var(--border-hover);
    background: var(--glass);
    backdrop-filter: blur(14px);
  }
  .dropzone svg{ width:20px; height:20px; stroke: var(--ice-dim); opacity:0.8; }
  .dropzone .main-label{ font-size:12.5px; font-weight:600; color: var(--text); }
  .dropzone .sub-label{ font-size:11px; color: var(--text-faint); }
  .dropzone button{
    margin-top:2px;
    background: var(--glass-strong);
    border: 1px solid var(--border-faint);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    cursor:pointer;
    transition: all 0.2s ease;
  }
  .dropzone button:hover{ border-color: var(--border-hover); background: var(--glass); }

  .status-line{ font-size:12px; color: var(--text-faint); display:flex; justify-content:space-between; }
  .status-line span.count{ color: var(--ice-dim); font-weight:600; }

  .art-control{ display:flex; justify-content:center; margin-top:-6px; }
  .art-control button{
    background: transparent;
    border: 1px solid var(--border-faint);
    color: var(--text-muted);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    cursor:pointer;
    transition: all 0.2s ease;
  }
  .art-control button:hover{
    border-color: var(--border-hover);
    background: var(--glass);
    backdrop-filter: blur(10px);
    color: var(--text);
  }

  /* ---------- PLAYLIST ---------- */
  .playlist-panel{ min-width:0; }
  .playlist-header{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom: 14px; padding: 0 4px;
  }
  .playlist-header h2{
    font-family:'Space Grotesk', sans-serif; font-weight:600;
    color: var(--text-muted); letter-spacing:0.02em; text-transform:uppercase; font-size:11.5px;
  }
  .playlist-header .hint{ font-size:12px; color: var(--text-faint); }

  #playlist{ list-style:none; display:flex; flex-direction:column; gap:2px; }
  .empty-state{
    border:1px solid var(--border-faint); border-radius:16px; padding: 48px 24px;
    text-align:center; color: var(--text-faint); font-size:13.5px;
  }

  .track{
    display:grid;
    grid-template-columns: 34px 1fr auto;
    align-items:center;
    gap: 14px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid transparent;
    cursor:pointer;
    transition: background 0.25s ease, border-color 0.25s ease, backdrop-filter 0.25s ease, transform 0.15s ease;
  }
  .track:hover{
    background: var(--glass);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border-color: var(--border-faint);
  }
  .track.active{
    background: linear-gradient(90deg, rgba(207,238,255,0.09), rgba(207,238,255,0.02));
    border-color: var(--border-hover);
  }
  .track.missing{ opacity: 0.35; cursor: default; }
  .track.missing:hover{ background:transparent; backdrop-filter:none; border-color:transparent; }

  .track-num{
    font-family:'Space Grotesk', sans-serif;
    font-size: 13px; color: var(--text-faint); font-weight:500;
    text-align:center;
  }
  .track.active .track-num{ color: transparent; }
  .eq{
    display:none;
    width:34px; height:16px; align-items:flex-end; justify-content:center; gap:3px;
  }
  .track.active .eq{ display:flex; }
  .eq span{
    width:3px; background: var(--ice); border-radius:2px;
    animation: eqbounce 0.9s ease-in-out infinite;
  }
  .eq span:nth-child(1){ height:40%; animation-delay:0s; }
  .eq span:nth-child(2){ height:100%; animation-delay:0.15s; }
  .eq span:nth-child(3){ height:65%; animation-delay:0.3s; }
  .track:not(.active) .eq{ display:none; }
  @keyframes eqbounce{ 0%,100%{ transform: scaleY(0.4);} 50%{ transform: scaleY(1);} }

  .track-info{ min-width:0; display:flex; flex-direction:column; gap:2px; }
  .track-info-row{ display:flex; align-items:center; gap:12px; min-width:0; }
  .track-thumb{
    width: 40px; height:40px; border-radius: 8px;
    object-fit: cover; flex-shrink:0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.06);
  }
  .track-thumb-empty{
    background: linear-gradient(135deg, #1c1c22, #0a0a0d);
  }
  .track-title{
    font-size: 14.5px; font-weight:500; color: var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .track.active .track-title{ color: var(--ice); }
  .track-feat{ font-size:12px; color: var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .track-dur{ font-size:12.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; }

  /* ---------- PLAYER BAR ---------- */
  .player-bar{
    position: fixed; left:0; right:0; bottom:0;
    background: rgba(10,10,13,0.72);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border-top: 1px solid var(--border-faint);
    padding: 14px 28px 18px 28px;
    z-index: 20;
  }
  .player-inner{
    max-width: 1180px; margin: 0 auto;
    display:flex; flex-direction:column; gap:10px;
  }
  .progress-row{
    display:flex; align-items:center; gap:10px;
  }
  .time{ font-size:11.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; width:38px; }
  .time.end{ text-align:right; }

  input[type=range]{
    -webkit-appearance:none; appearance:none;
    height: 4px; border-radius:99px;
    background: rgba(255,255,255,0.1);
    flex:1;
    cursor:pointer;
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:12px; height:12px; border-radius:50%;
    background: var(--ice);
    box-shadow: 0 0 0 4px rgba(207,238,255,0.15);
    transition: transform 0.15s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover{ transform: scale(1.2); }
  input[type=range]::-moz-range-thumb{
    width:12px; height:12px; border-radius:50%; border:none;
    background: var(--ice);
  }
  #seek{ background: linear-gradient(to right, var(--ice) 0%, var(--ice) 0%, rgba(255,255,255,0.1) 0%); }

  .controls-row{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    gap: 16px;
  }
  .now-playing{ min-width:0; display:flex; flex-direction:column; gap:1px; }
  .now-playing .np-title{ font-size:13.5px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .now-playing .np-sub{ font-size:11.5px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .transport{ display:flex; align-items:center; gap: 10px; justify-content:center; }
  .transport button{
    background: var(--glass);
    border: 1px solid var(--border-faint);
    color: var(--text);
    width: 38px; height:38px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: all 0.2s ease;
  }
  .transport button:hover{
    background: var(--glass-strong);
    border-color: var(--border-hover);
    backdrop-filter: blur(10px);
  }
  .transport button.play{
    width:46px; height:46px;
    background: var(--ice);
    color: #08080b;
    border-color: transparent;
  }
  .transport button.play:hover{ background:#e2f6ff; transform: scale(1.04); }
  .transport button#shuffleBtn{ width:32px; height:32px; }
  .transport button#shuffleBtn svg{ width:14px; height:14px; }
  .transport button#shuffleBtn.active{
    background: rgba(207,238,255,0.14);
    border-color: var(--border-hover);
    color: var(--ice);
  }
  .transport button#repeatBtn{ width:32px; height:32px; position:relative; }
  .transport button#repeatBtn svg{ width:14px; height:14px; }
  .transport button#repeatBtn.active{
    background: rgba(207,238,255,0.14);
    border-color: var(--border-hover);
    color: var(--ice);
  }
  .repeat-badge{
    display:none;
    position:absolute; bottom:-3px; right:-3px;
    width:14px; height:14px; border-radius:50%;
    background: var(--ice); color:#08080b;
    font-size:9px; font-weight:800;
    align-items:center; justify-content:center;
    line-height:1;
  }
  .transport button#repeatBtn.repeat-one .repeat-badge{ display:flex; }
  .transport svg{ width:16px; height:16px; }
  .transport button.play svg{ width:18px; height:18px; }

  .volume-wrap{ display:flex; align-items:center; gap:8px; justify-self:end; width: 130px; }
  .volume-wrap svg{ width:15px; height:15px; stroke: var(--text-faint); flex-shrink:0; }

  @media (max-width: 820px){
    .now-playing{ display:none; }
    .volume-wrap{ display:none; }
    .controls-row{ grid-template-columns: 1fr; }
    .player-bar{ padding: 12px 16px 14px 16px; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="disc-wrap" id="discWrap">
      <div class="disc" id="disc">
        <div class="disc-flip-wrap">
          <div class="disc-flip" id="discFlip">
            <div class="disc-face disc-face-front" id="discFaceFront"></div>
            <div class="disc-face disc-face-back" id="discFaceBack"></div>
          </div>
        </div>
        <div class="disc-sheen"></div>
        <div class="disc-spindle"></div>
      </div>
    </div>

    <div class="brand">
      <h6>Album</h6>
      <h1>HVL</h1>
      <h6> RPT MCK • Jun 17, 2026 • 30 songs</h6>
    </div>

    <div class="status-line">
      <span>Loaded: <span class="count" id="loadedCount">0</span> / 30 tracks</span>
      <span id="totalDur">--:--</span>
    </div>
  </aside>

  <main class="playlist-panel">
    <div class="playlist-header">
      <h2>Tracklist</h2>
      <span class="hint" id="playlistHint">Loading…</span>
    </div>
    <ul id="playlist"></ul>
  </main>
</div>

<div class="player-bar">
  <div class="player-inner">
    <div class="progress-row">
      <span class="time" id="curTime">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1" disabled>
      <span class="time end" id="durTime">0:00</span>
    </div>
    <div class="controls-row">
      <div class="now-playing">
        <div class="np-title" id="npTitle">Nothing playing</div>
        <div class="np-sub" id="npSub">Pick a track to start</div>
      </div>
      <div class="transport">
        <button id="shuffleBtn" title="Shuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3h4v4"/><path d="M3 20 21 3"/><path d="M17 21h4v-4"/><path d="M3 4l6.5 6.5"/><path d="M14.5 13.5 21 20"/></svg>
        </button>
        <button id="prevBtn" title="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l9-6v12z"/></svg>
        </button>
        <button id="playBtn" class="play" title="Play/Pause">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="nextBtn" title="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l9 6-9 6z"/></svg>
        </button>
        <button id="repeatBtn" title="Repeat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          <span class="repeat-badge" id="repeatBadge">1</span>
        </button>
      </div>
      <div class="volume-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
        <input type="range" id="volume" min="0" max="1" value="0.9" step="0.01">
      </div>
    </div>
  </div>
</div>

<audio id="audio"></audio>

<script>
(function(){
  /* Pre-bundled tracks — shipped inside /tracks next to this HTML file.
     Add more entries here as you receive the rest of the album. */
  const PRELOADED_TRACKS = [
    { num: 1,  filename: "01_-_Elegie.mp3" },
    { num: 2,  filename: "02_-_IDK.mp3" },
    { num: 3,  filename: "03_-_Wtf_Bby_I_m_Lit.mp3" },
    { num: 4,  filename: "04_-_Anh_Không_Muốn_Nó_Dễ_Dàng.mp3" },
    { num: 5,  filename: "05_-_Baby__feat__marzuz_.mp3" },
    { num: 6,  filename: "06_-_Yêu_Anh_Giết_Anh.mp3" },
    { num: 7,  filename: "07_-_Mắt_Môi_Tay_Chân__feat__Tage_.mp3" },
    { num: 8,  filename: "08_-_Đao_Của_Anh_Vừa.mp3" },
    { num: 9,  filename: "09_-_Là_Gì_Của_Nhau.mp3" },
    { num: 10, filename: "10_-_Night_In_Prague.mp3" },
    { num: 11, filename: "11_-_Một_Cái_Ôm.mp3" },
    { num: 12, filename: "12_-_Liệm.mp3" },
    { num: 13, filename: "13_-_Nếu_Như_Ta_Chẳng_Còn__feat__A$AP_Ướt_Mi_.mp3" },
    { num: 14, filename: "14_-_Ai_Mới_Là_Kẻ_Xấu_Xa.mp3" },
    { num: 15, filename: "15_-_Slippery__feat__Tùng_Dương_.mp3" },
    { num: 16, filename: "16_-_Intenpol.mp3" },
    { num: 17, filename: "17_-_Tây_Thi.mp3" },
    { num: 18, filename: "18_-_Hút_và_Hút.mp3" },
    { num: 19, filename: "19_-_Dưa_Chua.mp3" },
    { num: 20, filename: "20_-_Xa_Xôi__feat__Obito_.mp3" },
    { num: 21, filename: "21_-_Che_Phủ.mp3" },
    { num: 22, filename: "22_-_Oanh_M_=_Thuoc.mp3" },
    { num: 23, filename: "23_-_Ghet_Xog_Lai_Thik.mp3" },
    { num: 24, filename: "24_-_Nhìn_Kẻ_Thù_Của_Tao.mp3" },
    { num: 25, filename: "25_-_Envy__feat__Thành_Draw_.mp3" },
    { num: 26, filename: "26_-_Cảm_Ơn.mp3" },
    { num: 27, filename: "27_-_Không_Cần_Lo_Cho_Tao.mp3" },
    { num: 28, filename: "28_-_Huh__feat__RPT_Orijinn___Thành_Draw_.mp3" },
    { num: 29, filename: "29_-_Nguyễn_Văn_Mười.mp3" },
    { num: 30, filename: "30_-_Thịt_Lợn.mp3" }
  ].map(t => ({ ...t, art: 'covers/' + String(t.num).padStart(2,'0') + '.jpg' }));
  const COVER_PATH = "cover.jpg";

  const state = { tracks: [], currentIndex: -1, playing: false, shuffle: false, repeatMode: 'all' };

  const playlistEl = document.getElementById('playlist');
  const loadedCount = document.getElementById('loadedCount');
  const playlistHint = document.getElementById('playlistHint');

  const audio = document.getElementById('audio');
  const seek = document.getElementById('seek');
  const curTime = document.getElementById('curTime');
  const durTime = document.getElementById('durTime');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const volume = document.getElementById('volume');
  const disc = document.getElementById('disc');
  const discWrap = document.getElementById('discWrap');
  const discFlip = document.getElementById('discFlip');
  const discFaceFront = document.getElementById('discFaceFront');
  const discFaceBack = document.getElementById('discFaceBack');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  const npTitle = document.getElementById('npTitle');
  const npSub = document.getElementById('npSub');

  audio.volume = parseFloat(volume.value);

  const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

  function parseFilename(filename){
    let name = filename.replace(/\.(m4a|mp3)$/i, '');
    let num = '';
    let m = name.match(/^(\d+)[_\-\s]+-?[_\-\s]*(.+)$/);
    let rest = name;
    if(m){ num = m[1]; rest = m[2]; }
    let title, feat = null;
    const featMatch = rest.match(/^(.+?)__feat__(.+?)_*$/i);
    if(featMatch){
      title = featMatch[1].replace(/_/g,' ').replace(/\s+/g,' ').trim();
      feat = featMatch[2].replace(/_/g,' ').replace(/\s+/g,' ').trim();
    } else {
      title = rest.replace(/_/g,' ').replace(/\s+/g,' ').trim();
    }
    title = title.replace(/\bI m\b/gi, "I'm");
    return { num: num ? parseInt(num,10) : 9999, title: title || filename, feat };
  }

  function formatTime(sec){
    if(!isFinite(sec) || sec < 0) return '0:00';
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60);
    return m + ':' + String(s).padStart(2,'0');
  }

  function addTrack(filename, url, art){
    if(state.tracks.some(t => t.filename === filename)) return;
    const parsed = parseFilename(filename);
    state.tracks.push({
      filename,
      num: parsed.num,
      title: parsed.title,
      feat: parsed.feat,
      url,
      art: art || null
    });
  }

  function handleFiles(fileList){
    const files = Array.from(fileList).filter(f => /\.(m4a|mp3)$/i.test(f.name) || f.type.startsWith('audio'));
    if(files.length === 0) return;
    files.forEach(file => addTrack(file.name, URL.createObjectURL(file)));
    state.tracks.sort((a,b) => a.num - b.num);
    renderPlaylist();
  }

  function renderPlaylist(){
    loadedCount.textContent = state.tracks.length;
    playlistEl.innerHTML = '';

    if(state.tracks.length === 0){
      playlistHint.textContent = 'No tracks loaded yet';
      const empty = document.createElement('li');
      empty.className = 'empty-state';
      empty.textContent = 'Drop .m4a or .mp3 files into the panel on the left to start listening.';
      playlistEl.appendChild(empty);
      return;
    }

    playlistHint.textContent = state.tracks.length + ' tracks · click to play';

    state.tracks.forEach((track, idx) => {
      const li = document.createElement('li');
      li.className = 'track' + (idx === state.currentIndex ? ' active' : '');
      li.innerHTML = `
        <span class="track-num">${String(track.num).padStart(2,'0')}</span>
        <div class="track-info-row">
          ${track.art ? `<img class="track-thumb" src="${track.art}" alt="" loading="lazy">` : '<div class="track-thumb track-thumb-empty"></div>'}
          <div class="track-info">
            <span class="track-title">${escapeHtml(track.title)}</span>
            ${track.feat ? `<span class="track-feat">feat. ${escapeHtml(track.feat)}</span>` : ''}
          </div>
        </div>
        <span class="track-dur">
          <span class="eq"><span></span><span></span><span></span></span>
        </span>
      `;
      li.addEventListener('click', () => playTrack(idx));
      playlistEl.appendChild(li);
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function playTrack(idx){
    if(idx < 0 || idx >= state.tracks.length) return;
    state.currentIndex = idx;
    const track = state.tracks[idx];
    audio.src = track.url;
    audio.play().catch(()=>{});
    updateNowPlaying();
    if(track.art){
      discFaceBack.style.backgroundImage = `url("${track.art}")`;
      discFlip.classList.add('flipped');
    } else {
      discFlip.classList.remove('flipped');
    }
    renderPlaylist();
  }

  function updateNowPlaying(){
    const track = state.tracks[state.currentIndex];
    if(!track){
      npTitle.textContent = 'Nothing playing';
      npSub.textContent = 'Pick a track to start';
      return;
    }
    npTitle.textContent = track.title;
    npSub.textContent = track.feat ? ('feat. ' + track.feat) : ('Track ' + String(track.num).padStart(2,'0'));
  }

  function getNextIndex(){
    if(state.shuffle && state.tracks.length > 1){
      let idx;
      do{ idx = Math.floor(Math.random() * state.tracks.length); } while(idx === state.currentIndex);
      return idx;
    }
    return state.currentIndex + 1 < state.tracks.length ? state.currentIndex + 1 : -1;
  }

  function togglePlay(){
    if(state.currentIndex === -1){
      if(state.tracks.length > 0) playTrack(0);
      return;
    }
    if(audio.paused){ audio.play().catch(()=>{}); }
    else { audio.pause(); }
  }

  audio.addEventListener('play', () => {
    state.playing = true;
    playIcon.innerHTML = ICON_PAUSE;
    disc.classList.add('playing');
  });
  audio.addEventListener('pause', () => {
    state.playing = false;
    playIcon.innerHTML = ICON_PLAY;
    disc.classList.remove('playing');
  });
  audio.addEventListener('ended', () => {
    if(state.repeatMode === 'one'){
      audio.currentTime = 0;
      audio.play().catch(()=>{});
      return;
    }
    let next = getNextIndex();
    if(next === -1 && state.tracks.length > 0){
      next = state.shuffle ? Math.floor(Math.random() * state.tracks.length) : 0;
    }
    if(next !== -1){
      playTrack(next);
    } else {
      disc.classList.remove('playing');
    }
  });
  audio.addEventListener('timeupdate', () => {
    if(!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    seek.value = pct;
    seek.style.background = `linear-gradient(to right, var(--ice) ${pct}%, rgba(255,255,255,0.1) ${pct}%)`;
    curTime.textContent = formatTime(audio.currentTime);
  });
  audio.addEventListener('loadedmetadata', () => {
    durTime.textContent = formatTime(audio.duration);
    seek.disabled = false;
  });

  seek.addEventListener('input', () => {
    if(!audio.duration) return;
    audio.currentTime = (seek.value / 100) * audio.duration;
  });

  volume.addEventListener('input', () => { audio.volume = parseFloat(volume.value); });

  playBtn.addEventListener('click', togglePlay);
  prevBtn.addEventListener('click', () => {
    if(audio.currentTime > 3){ audio.currentTime = 0; return; }
    if(state.currentIndex > 0) playTrack(state.currentIndex - 1);
  });
  nextBtn.addEventListener('click', () => {
    let next = getNextIndex();
    if(next === -1 && state.tracks.length > 0){
      next = state.shuffle ? Math.floor(Math.random() * state.tracks.length) : 0;
    }
    if(next !== -1) playTrack(next);
  });
  repeatBtn.classList.toggle('repeat-one', state.repeatMode === 'one');
  repeatBtn.title = state.repeatMode === 'one' ? 'Repeat one (on)' : 'Repeat one';

  shuffleBtn.addEventListener('click', () => {
    state.shuffle = !state.shuffle;
    shuffleBtn.classList.toggle('active', state.shuffle);
  });
  repeatBtn.addEventListener('click', () => {
    state.repeatMode = state.repeatMode === 'one' ? 'all' : 'one';
    repeatBtn.classList.toggle('repeat-one', state.repeatMode === 'one');
    repeatBtn.classList.toggle('active', state.repeatMode === 'one');
    repeatBtn.title = state.repeatMode === 'one' ? 'Repeat one (on)' : 'Repeat one';
  });

  discWrap.addEventListener('click', () => {
    discFlip.classList.toggle('flipped');
  });

  document.addEventListener('keydown', (e) => {
    if(e.code === 'Space' && document.activeElement.tagName !== 'INPUT'){
      e.preventDefault();
      togglePlay();
    }
  });

  /* Load the bundled cover art */
  const testImg = new Image();
  testImg.onload = () => { discFaceFront.style.backgroundImage = `url("${COVER_PATH}")`; };
  testImg.src = COVER_PATH;

  /* Load the bundled tracks from /tracks (relative path — works locally and once hosted) */
  PRELOADED_TRACKS.forEach(t => addTrack(t.filename, 'tracks/' + t.filename, t.art));
  state.tracks.sort((a,b) => a.num - b.num);
  renderPlaylist();
})();
</script>

</body>
</html>
